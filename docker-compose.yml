services:
  app:
    build:
      context: .
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - app-data:/app/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  app-data:
